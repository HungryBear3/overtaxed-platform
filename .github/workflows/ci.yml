name: CI

on:
  # Read-only and credential-free: dependent stacked PRs need an attached
  # exact-head check just like PRs targeting main.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: build · type-check · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Every engines range in package-lock.json admits 24: next >=20.9.0,
      # prisma ^20.19 || ^22.12 || >=24, jest ^18.14 || ^20 || ^22 || >=24.
      # The repo pins no version of its own — no .nvmrc, no engines field — so
      # this is the pin, and it is 24 to match the Node that Vercel runs in
      # production. A gate on an older major certifies a runtime nothing
      # deploys on.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      # The owner-role hardening suite creates its own isolated cluster with
      # initdb/pg_ctl. Pin the supported PostgreSQL major explicitly: the
      # ubuntu-latest image does not guarantee server executables on PATH, and
      # this suite must run rather than silently skip when they are absent.
      - name: Install PostgreSQL 18
        run: |
          . /etc/os-release
          key_tmp="$(mktemp)"
          trap 'rm -f -- "$key_tmp"' EXIT
          curl --fail --show-error --silent \
            --output "$key_tmp" \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          mapfile -t primary_fingerprints < <(
            gpg --batch --show-keys --with-colons "$key_tmp" \
              | awk -F: '$1 == "pub" { want_fpr=1; next } want_fpr && $1 == "fpr" { print $10; want_fpr=0 }'
          )
          test "${#primary_fingerprints[@]}" -eq 1
          test "${primary_fingerprints[0]}" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo install -o root -g root -m 0644 "$key_tmp" /usr/share/keyrings/postgresql-archive-keyring.asc
          rm -f -- "$key_tmp"
          trap - EXIT
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-18
          /usr/lib/postgresql/18/bin/initdb --version \
            | grep --quiet --extended-regexp '^initdb \(PostgreSQL\) 18(\.[0-9]+)+( \([^[:cntrl:]]+\))?$'
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # `npm ci` is the install that refuses to run when package-lock.json and
      # package.json disagree. Its postinstall hook runs `prisma generate`,
      # which is what makes the suites importing @prisma/client runnable.
      - name: Install
        run: npm ci

      # package.json -> scripts/build-with-migrate-retry.mjs, which runs
      # `prisma generate` then `next build` and deliberately runs no migration.
      # Since next.config.mjs stopped setting typescript.ignoreBuildErrors, this
      # step is also the type gate for everything the build graph reaches.
      - name: Build
        run: npm run build

      # Widens the type gate past the build graph: tsconfig.json includes
      # **/*.ts, so this also covers __tests__/ and tools/, which .vercelignore
      # keeps out of Vercel uploads and which therefore no deploy type-checks.
      #
      # Ordered after Build so the gitignored next-env.d.ts exists first. That
      # ordering is insurance, not a requirement: `tsc --noEmit` was verified to
      # pass on a cold tree with neither .next nor next-env.d.ts present, so the
      # steps can be swapped if a faster first failure is ever worth more.
      - name: Type-check
        run: npm run type-check

      # No step in this job binds an environment variable, and none needs to.
      # `prisma generate` falls back to a placeholder URL when DATABASE_URL is
      # unset (prisma.config.ts) and no page reads the database while
      # prerendering, so the build runs without one. Each suite assigns the
      # variables it needs. Four integration suites skip themselves unless
      # TEST_DATABASE_URL is set; the owner-role hardening suite instead starts
      # and removes its own disposable local PostgreSQL cluster.
      - name: Test
        run: npm test -- --ci --maxWorkers=2

  recovery-restore-matrix:
    name: synthetic fixture portability · PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install PostgreSQL 17 source and ${{ matrix.postgres }} target
        run: |
          . /etc/os-release
          key_tmp="$(mktemp)"
          trap 'rm -f -- "$key_tmp"' EXIT
          curl --fail --show-error --silent --output "$key_tmp" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          mapfile -t primary_fingerprints < <(gpg --batch --show-keys --with-colons "$key_tmp" | awk -F: '$1 == "pub" { want_fpr=1; next } want_fpr && $1 == "fpr" { print $10; want_fpr=0 }')
          test "${#primary_fingerprints[@]}" -eq 1
          test "${primary_fingerprints[0]}" = "B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8"
          sudo install -o root -g root -m 0644 "$key_tmp" /usr/share/keyrings/postgresql-archive-keyring.asc
          echo "deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17 "postgresql-${{ matrix.postgres }}"
          /usr/lib/postgresql/17/bin/initdb --version | grep --quiet '^initdb (PostgreSQL) 17'
          /usr/lib/postgresql/${{ matrix.postgres }}/bin/initdb --version | grep --quiet '^initdb (PostgreSQL) ${{ matrix.postgres }}'
      - name: Install
        run: npm ci
      - name: Restore synthetic encrypted recovery fixture
        run: |
          set -euo pipefail
          source_runtime="$(mktemp -d /tmp/os.XXXXXX)"
          target_runtime="$(mktemp -d /tmp/ot.XXXXXX)"
          cleanup() {
            rm -rf -- "$source_runtime" "$target_runtime"
          }
          trap cleanup EXIT INT TERM
          ./node_modules/.bin/tsx __tests__/helpers/prepare-neutral-recovery-ci-runtime.mts \
            "$source_runtime" /usr/lib/postgresql/17/bin/pg_config
          ./node_modules/.bin/tsx __tests__/helpers/prepare-neutral-recovery-ci-runtime.mts \
            "$target_runtime" /usr/lib/postgresql/${{ matrix.postgres }}/bin/pg_config
          export OT_TEST_SOURCE_PG_BIN="$source_runtime/b"
          export OT_TEST_SOURCE_PG_RUNTIME="$source_runtime"
          export OT_TEST_TARGET_PG_BIN="$target_runtime/b"
          export OT_TEST_TARGET_PG_RUNTIME="$target_runtime"
          export OT_NEUTRAL_PRODUCTION_RECOVERY_GPG_PATH=/usr/bin/gpg
          npm test -- --ci --runInBand __tests__/fulfillment/neutral-production-recovery-postgres.integration.test.ts
